# Kombú Instagram publisher (@kombu.amazonia). Cron only: no public URL.
name = "kombu-instagram"
main = "index.mjs"
compatibility_date = "2026-10-01"
workers_dev = false
preview_urls = false

[[kv_namespaces]]
binding = "STATE"
id = "b59df63d5f8d4b91a087a818f4252c3e"

# Manaus is UTC-4. A single shared trigger stays within the account's free quota.
# Stories: 11:00..11:20 UTC (07:00..07:20 Manaus), one image per five minutes.
# Feed: only 13:00 UTC (09:00 Manaus), gated in index.mjs.
# All remaining ticks are no-ops; other Workers and their schedules are untouched.
[triggers]
crons = ["0,5,10,15,20 11,13 * * *"]
